<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Les Estacions de l'Any</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
      position: relative;
    }

    .corner-img {
      position: absolute;
      width: 200px;
      height: 200px;
      background-size: cover;
      background-position: center;
      opacity: 0.6;
      z-index: -1;
    }

    .spring { top: 0; left: 0; background-image: url('C:\Users\DIEGO\Desktop\estaciones-del-año-en-México-lifeder-ilust-min.jpg'); }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 36px;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .members {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-top: 40px;
    }

    .member {
      background-color: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 180px;
    }

    .member p {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .member small {
      font-size: 14px;
      color: #666;
    }

    .member button {
      margin-top: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .member button:hover {
      background-color: #388e3c;
    }

    .footer {
      margin-top: 50px;
      font-style: italic;
      font-size: 16px;
      color: #607d8b;
    }
  </style>
</head>
<body>

  <!-- Imatges a cada cantonada -->
  <div class="corner-img spring"></div>
  <div class="corner-img summer"></div>
  <div class="corner-img autumn"></div>
  <div class="corner-img winter"></div>

  <!-- Contingut -->
  <div class="container">
    <h1>🌸☀️🍂❄️ Les Estacions de l'Any</h1>
    <p>Grup: Eduard, Arnau, Adrián, Genís</p>

    <div class="members">
      <div class="member">
        <p>Eduard</p>
        <small>Primavera</small>
        <button onclick="location.href='eduard.html'">Veure activitat</button>
      </div>
      <div class="member">
        <p>Arnau</p>
        <small>Estiu</small>
        <button onclick="location.href='arnau.html'">Veure activitat</button>
      </div>
      <div class="member">
        <p>Adrián</p>
        <small>Tardor</small>
        <button onclick="location.href='adrian.html'">Veure activitat</button>
      </div>
      <div class="member">
        <p>Genís</p>
        <small>Hivern</small>
        <button onclick="location.href='genis.html'">Veure activitat</button>
      </div>
    </div>

    <div class="footer">
      Activitat realitzada durant el curs acadèmic 2024–2025 – Grau d’Educació Infantil
    </div>
  </div>

</body>
</html>
